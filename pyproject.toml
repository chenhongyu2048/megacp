[build-system]
requires = ["setuptools==81.0.0", "wheel==0.47.0", "torch==2.11.0", "ninja==1.13.0"]
build-backend = "setuptools.build_meta"

[project]
name = "megacp"
version = "0.1.0"
description = "Hopper context-parallel attention for training and inference"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.1.3", "torch==2.11.0", "triton==3.6.0"]

[dependency-groups]
build = ["ninja==1.13.0", "pybind11==3.1.0", "setuptools==81.0.0", "wheel==0.47.0"]

[tool.uv]
default-groups = ["build"]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
